{% extends "base.html" %}

{% block header_title %}URL Repository{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[calc(100vh-10rem)]">
    <!-- Filters Header -->
    <div class="p-4 border-b border-gray-100 bg-gray-50 flex gap-4">
        <div class="flex-1 relative">
            <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
            <input type="text" name="q" placeholder="Search URLs..." value="{{ q }}"
                hx-get="/repository" hx-target="#repo-tbody" hx-trigger="keyup changed delay:500ms"
                hx-include="[name='domain_id']"
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <select name="domain_id" 
            hx-get="/repository" hx-target="#repo-tbody"
            hx-include="[name='q']"
            class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
            <option value="0">All Domains</option>
            {% for d in domains %}
                <option value="{{ d.id }}" {% if d.id == domain_id|int %}selected{% endif %}>{{ d.url }}</option>
            {% endfor %}
        </select>
        <i id="spinner" class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl htmx-indicator self-center ml-2"></i>
    </div>

    <!-- Data Table -->
    <div class="overflow-auto flex-1">
        <table class="w-full text-left border-collapse text-sm">
            <thead class="sticky top-0 bg-gray-50 border-b border-gray-200 shadow-sm z-10">
                <tr class="text-gray-500">
                    <th class="p-3 font-medium whitespace-nowrap">ID</th>
                    <th class="p-3 font-medium">URL</th>
                    <th class="p-3 font-medium">Status</th>
                    <th class="p-3 font-medium">Archived Submissions</th>
                </tr>
            </thead>
            <tbody id="repo-tbody">
                {% include "partials/repository_rows.html" %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
