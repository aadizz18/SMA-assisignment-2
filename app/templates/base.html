<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Archive Submitter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
</head>
<body class="bg-gray-50 flex h-screen font-sans text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg z-10">
        <div class="h-16 flex items-center justify-center border-b border-slate-700 font-bold text-xl tracking-wider">
            <i class="fa-solid fa-box-archive mr-3"></i> Archiver
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2">
            <a href="/" class="block px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if request.url.path == '/' %}bg-indigo-600 hover:bg-indigo-700{% endif %}">
                <i class="fa-solid fa-chart-line w-6"></i> Dashboard
            </a>
            <a href="/domains" class="block px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if request.url.path == '/domains' %}bg-indigo-600 hover:bg-indigo-700{% endif %}">
                <i class="fa-solid fa-globe w-6"></i> Domains
            </a>
            <a href="/repository" class="block px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if request.url.path == '/repository' %}bg-indigo-600 hover:bg-indigo-700{% endif %}">
                <i class="fa-solid fa-database w-6"></i> Repository
            </a>
        </nav>
        <div class="p-4 text-xs text-slate-500 text-center border-t border-slate-800">
            Auto-Backup System v1.0
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white shadow-sm flex items-center px-8 border-b">
            <h1 class="text-2xl font-semibold text-gray-700">{% block header_title %}Overview{% endblock %}</h1>
        </header>
        
        <div class="flex-1 overflow-auto p-8">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
